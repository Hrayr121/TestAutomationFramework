# Runs UI tests on every push/PR to main and on a nightly schedule.
# Uses Maven Central (no corporate settings.xml). Set repo secret SLACK_WEBHOOK_URL for failure alerts.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Nightly smoke at 02:00 UTC (adjust cron as needed)
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: temurin
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Print browser versions
        run: |
          google-chrome --version
          chromedriver --version || true

      - name: Run tests
        env:
          WDM_CACHE_PATH: /tmp/wdm-cache
        run: mvn -B clean test -Denv=ci

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            target/screenshots/

      - name: Slack notification (success or failure)
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skip notification"
            exit 0
          fi
          case "$JOB_STATUS" in
            success)   ICON=":white_check_mark:"; STATE="passed" ;;
            failure)   ICON=":x:";                STATE="failed" ;;
            cancelled) ICON=":no_entry_sign:";    STATE="cancelled" ;;
            *)         ICON=":grey_question:";    STATE="$JOB_STATUS" ;;
          esac
          TEXT="${ICON} CI ${STATE} for ${GITHUB_REPOSITORY} @ ${GITHUB_REF_NAME} — ${RUN_URL}"
          curl -sS -X POST -H "Content-type: application/json" \
            -d "$(jq -n --arg t "$TEXT" '{text: $t}')" \
            "$SLACK_WEBHOOK_URL"
